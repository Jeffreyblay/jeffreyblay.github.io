<style>
.page-head{padding:56px 0 34px;}
.page-head h1{font-size:clamp(2.2rem,4.5vw,3rem);margin-bottom:10px;}

.filters{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.fbtn{
  font-family:inherit;font-size:14px;color:var(--ink-2);
  background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;cursor:pointer;transition:all .15s;
}
.fbtn:hover{border-color:var(--ink-2);color:var(--ink);}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;}
.fcount{margin-left:auto;font-size:13.5px;color:var(--muted);}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:32px 0 80px;}
.pcard{
  border:1px solid var(--line);border-radius:6px;padding:22px 20px;
  cursor:pointer;display:flex;flex-direction:column;
  transition:border-color .18s,box-shadow .18s;
}
.pcard:hover{border-color:var(--ink);box-shadow:0 2px 14px rgba(0,0,0,.05);}
.pcard .kind{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
.pcard h3{font-size:1.02rem;margin-bottom:7px;}
.pcard p{font-size:14.5px;color:var(--ink-2);flex:1;}
.pcard .more{
  font-size:13.5px;font-weight:600;margin-top:14px;
  display:inline-flex;gap:6px;align-items:center;transition:gap .15s;
}
.pcard .more::after{content:'\2192';}
.pcard:hover .more{gap:10px;}

/* modal */
.overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);
  display:none;align-items:flex-start;justify-content:center;
  padding:min(8vh,70px) 20px 40px;overflow-y:auto;
}
.overlay.open{display:flex;}
.modal{
  background:#fff;width:100%;max-width:680px;border-radius:8px;
  padding:34px 32px;position:relative;animation:up .2s ease;
}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;
  border:1px solid var(--line);border-radius:5px;background:#fff;
  cursor:pointer;font-size:17px;line-height:1;color:var(--muted);
}
.close:hover{border-color:var(--ink);color:var(--ink);}
.modal .kind{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
.modal h2{font-size:1.5rem;margin-bottom:12px;}
.modal .summary{font-size:15.5px;color:var(--ink-2);margin-bottom:20px;}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.fact-l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.fact-v{font-size:14.5px;}
.what{margin:0 0 20px;padding-left:18px;}
.what li{font-size:14.5px;color:var(--ink-2);margin-bottom:6px;}
.modal .tags{margin-bottom:22px;}
.links{display:flex;gap:10px;flex-wrap:wrap;}

@media(max-width:860px){.cards{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){
  .cards{grid-template-columns:1fr;}
  .facts{grid-template-columns:1fr;}
  .modal{padding:28px 20px;}
}
</style>

const CATNAME = {cv:'Research & AI', gis:'Mapping & GIS', analytics:'Data analysis',
                 apps:'Apps', mlops:'Data engineering'};

const cardsEl = document.getElementById('cards');
const countEl = document.getElementById('count');

function render(cat){
  const items = cat === 'all' ? PROJECTS : PROJECTS.filter(p => p.cat === cat);
  countEl.textContent = items.length + (items.length === 1 ? ' project' : ' projects');
  cardsEl.innerHTML = items.map(p => `
    <div class="pcard" data-id="${p.id}" tabindex="0" role="button">
      <div class="kind">${CATNAME[p.cat]}</div>
      <h3>${p.title}</h3>
      <p>${p.tagline}</p>
      <span class="more">Read more</span>
    </div>`).join('');
}

function filterTo(cat, btn){
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('on', b === btn));
  render(cat);
}

/* the stored outcome is one long sentence joined by middots: split it into bullets */
function bullets(text){
  return text.split('\u00b7').map(s => s.trim()).filter(Boolean)
             .map(s => `<li>${s.replace(/\.$/, '')}.</li>`).join('');
}

function openModal(id){
  const p = PROJECTS.find(x => x.id === id);
  if(!p) return;
  const facts = p.meta.length
    ? `<div class="facts">${p.meta.map(([l,v]) =>
        `<div><div class="fact-l">${l}</div><div class="fact-v">${v}</div></div>`).join('')}</div>`
    : '';
  const links = p.links.map(l =>
    `<a class="btn ${l.primary ? '' : 'btn-outline'}" href="${l.url}"${l.external ? ' target="_blank" rel="noopener"' : ''}>${l.label}</a>`
  ).join('');
  document.getElementById('modalBody').innerHTML = `
    <div class="kind">${CATNAME[p.cat]}</div>
    <h2>${p.title}</h2>
    <p class="summary">${p.summary}</p>
    ${facts}
    <ul class="what">${bullets(p.outcome)}</ul>
    <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    <div class="links">${links}</div>`;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
cardsEl.addEventListener('click', e => {
  const c = e.target.closest('.pcard'); if(c) openModal(c.dataset.id);
});
cardsEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){
    const c = e.target.closest('.pcard');
    if(c){ e.preventDefault(); openModal(c.dataset.id); }
  }
});

render('all');

/* deep links kept working: projects.html#cv, #gis, #apps ... */
window.addEventListener('DOMContentLoaded', () => {
  const h = location.hash.replace('#','');
  const map = {cv:'cv', 'rs-gis':'gis', gis:'gis', analytics:'analytics', apps:'apps', mlops:'mlops'};
  if(h && map[h]){
    const btn = document.querySelector(`.fbtn[data-cat="${map[h]}"]`);
    if(btn) filterTo(map[h], btn);
  }
});
</script>
